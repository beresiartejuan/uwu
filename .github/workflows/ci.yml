name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (Rust estable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Ejemplos
        run: |
          cargo build --release
          for f in examples/*.uwu; do
            [ "$f" = examples/errores.uwu ] && continue
            ./target/release/uwu "$f"
          done
          ./target/release/uwu examples/modulos/main.uwu

  msrv:
    name: versión mínima (Rust 1.83)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83
      - run: cargo test
